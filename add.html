<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Add album | Album Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700;800&family=Newsreader:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="site">
    <h1>Add album</h1>
    <nav><a href="index.html">Back to log</a></nav>
  </header>

  <details class="card" id="settings" style="margin-top:1.25rem">
    <summary>GitLab connection (one-time setup)</summary>
    <p class="hint">Saved only in this browser. Needed so the Save button can add the album to your repo.</p>
    <div class="field"><label>Project path or ID<input type="text" id="project" placeholder="yourname/album-log" autocapitalize="none"></label></div>
    <div class="row">
      <label>Branch<input type="text" id="branch" value="main" autocapitalize="none"></label>
      <label>Access token<input type="password" id="token" autocomplete="off"></label>
    </div>
    <button type="button" class="ghost" id="saveSettings">Save connection</button>
  </details>

  <div class="card">
    <label>Look up an album (optional)
      <input type="search" id="lookupQ" placeholder="e.g. OK Computer Radiohead">
    </label>
    <p class="hint">Fills in artist, year, genre, and cover art for you.</p>
    <button type="button" class="ghost" id="lookupBtn" style="margin-top:.6rem">Search</button>
    <div class="results" id="results"></div>
  </div>

  <form id="form" class="card">
    <div class="row">
      <label>Album title *<input type="text" id="title" required></label>
      <label>Artist *<input type="text" id="artist" required></label>
    </div>

    <div class="field">
      <label for="ratingNum">Rating (0 to 10) *</label>
      <div class="rate">
        <input type="range" id="ratingRange" min="0" max="10" step="0.1" value="7">
        <input type="number" id="ratingNum" min="0" max="10" step="0.1" value="7.0" required>
      </div>
    </div>

    <div class="row">
      <label>Date listened *<input type="date" id="date" required></label>
      <label>Listen type
        <select id="relisten"><option value="false">First listen</option><option value="true">Re-listen</option></select>
      </label>
    </div>

    <div class="field"><label>Review<textarea id="review"></textarea></label></div>

    <div class="row">
      <label>Release year<input type="number" id="year" min="1900" max="2100"></label>
      <label>Genre<input type="text" id="genre" list="genreList" autocomplete="off"></label>
    </div>
    <datalist id="genreList"></datalist>
    <div class="field"><label>Tags (separate with commas)<input type="text" id="tags" placeholder="shoegaze, late night"></label></div>
    <div class="field"><label>Cover image URL (https)<input type="text" id="cover" autocapitalize="none"></label></div>

    <button type="submit" id="saveBtn">Save album</button>
    <button type="button" class="ghost" id="copyBtn">Copy entry instead</button>
    <div class="msg" id="msg" role="status"></div>
  </form>
</div>

<script>
const $ = id => document.getElementById(id);
const KEY = "albumLogSettings";
let settings = {};
try { settings = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch(e){}
$("project").value = settings.project || "";
$("branch").value = settings.branch || "main";
$("token").value = settings.token || "";
if(!settings.token || !settings.project) $("settings").open = true;
$("date").value = new Date().toLocaleDateString("en-CA");

$("saveSettings").onclick = () => {
  settings = {project:$("project").value.trim(), branch:$("branch").value.trim()||"main", token:$("token").value.trim()};
  localStorage.setItem(KEY, JSON.stringify(settings));
  say("Connection saved on this device.");
  $("settings").open = false;
  loadGenres();
};

// Rating slider and number box stay in sync
const clamp = v => Math.min(10, Math.max(0, Math.round(v*10)/10));
$("ratingRange").oninput = e => $("ratingNum").value = (+e.target.value).toFixed(1);
$("ratingNum").oninput = e => { if(e.target.value!=="") $("ratingRange").value = clamp(+e.target.value); };

function say(t, err){ $("msg").textContent = t; $("msg").className = "msg" + (err ? " err" : ""); }

function buildEntry(){
  const e = {
    title: $("title").value.trim(),
    artist: $("artist").value.trim(),
    rating: clamp(+$("ratingNum").value),
    dateListened: $("date").value,
    relisten: $("relisten").value === "true",
    review: $("review").value.trim()
  };
  if($("year").value) e.year = +$("year").value;
  if($("genre").value.trim()) e.genre = $("genre").value.trim();
  const tags = $("tags").value.split(",").map(t=>t.trim().toLowerCase()).filter(Boolean);
  e.tags = tags;
  const c = $("cover").value.trim();
  e.cover = /^https:\/\//.test(c) ? c : "";
  return e;
}

// GitLab helpers
const api = () => `https://gitlab.com/api/v4/projects/${encodeURIComponent(settings.project)}/repository/files/albums.json`;
const headers = () => ({"PRIVATE-TOKEN": settings.token, "Content-Type":"application/json"});
const decode = b64 => new TextDecoder().decode(Uint8Array.from(atob(b64), c => c.charCodeAt(0)));

async function getFile(){
  const r = await fetch(`${api()}?ref=${encodeURIComponent(settings.branch)}`, {headers:headers()});
  if(!r.ok) throw new Error(r.status===401 ? "GitLab rejected the token." : r.status===404 ? "Could not find albums.json. Check the project path and branch." : "GitLab error " + r.status);
  return r.json();
}

async function loadGenres(){
  if(!settings.token || !settings.project) return;
  try{
    const f = await getFile();
    const list = JSON.parse(decode(f.content));
    const genres = [...new Set(list.map(a=>a.genre).filter(Boolean))].sort();
    $("genreList").innerHTML = genres.map(g=>`<option value="${g.replace(/"/g,"&quot;")}">`).join("");
  }catch(e){}
}
loadGenres();

$("form").onsubmit = async ev => {
  ev.preventDefault();
  if(!settings.token || !settings.project){ $("settings").open = true; say("Add your GitLab connection first.", true); return; }
  $("saveBtn").disabled = true; say("Saving...");
  try{
    const f = await getFile();
    const list = JSON.parse(decode(f.content));
    const entry = buildEntry();
    list.push(entry);
    const r = await fetch(api(), {
      method:"PUT", headers:headers(),
      body: JSON.stringify({
        branch: settings.branch,
        content: JSON.stringify(list, null, 2) + "\n",
        commit_message: `Add album: ${entry.artist} - ${entry.title}`,
        last_commit_id: f.last_commit_id
      })
    });
    if(!r.ok) throw new Error(r.status===403 ? "Token does not have permission to write. It needs the api scope and Developer role or higher." : "Save failed (GitLab error " + r.status + "). Try again.");
    say("Saved. Your site will update in about a minute.");
    $("form").reset(); $("ratingRange").value = 7; $("ratingNum").value = "7.0"; $("date").value = new Date().toLocaleDateString("en-CA");
    loadGenres();
  }catch(e){ say(e.message, true); }
  $("saveBtn").disabled = false;
};

$("copyBtn").onclick = async () => {
  if(!$("title").value || !$("artist").value){ say("Enter a title and artist first.", true); return; }
  const text = JSON.stringify(buildEntry(), null, 2);
  try{ await navigator.clipboard.writeText(text); say("Copied. Paste it into albums.json, after a comma following the last entry."); }
  catch(e){ say("Could not copy automatically.", true); }
};

// MusicBrainz lookup
$("lookupBtn").onclick = async () => {
  const q = $("lookupQ").value.trim(); if(!q) return;
  $("results").innerHTML = '<p class="hint">Searching...</p>';
  try{
    const r = await fetch(`https://musicbrainz.org/ws/2/release-group/?query=${encodeURIComponent(q)}&limit=5&fmt=json`);
    const data = await r.json();
    const groups = data["release-groups"] || [];
    if(!groups.length){ $("results").innerHTML = '<p class="hint">No matches. Fill in the details by hand.</p>'; return; }
    $("results").innerHTML = "";
    groups.forEach(g => {
      const artist = (g["artist-credit"]||[]).map(a=>a.name).join("");
      const year = (g["first-release-date"]||"").slice(0,4);
      const b = document.createElement("button"); b.type = "button";
      b.textContent = `${g.title} by ${artist}${year ? " (" + year + ")" : ""}`;
      b.onclick = () => {
        $("title").value = g.title; $("artist").value = artist;
        if(year) $("year").value = year;
        const tags = (g.tags||[]).sort((a,b)=>b.count-a.count).map(t=>t.name);
        if(tags[0] && !$("genre").value) $("genre").value = tags[0].replace(/\b\w/g, c=>c.toUpperCase());
        if(tags.length > 1) $("tags").value = tags.slice(1,4).join(", ");
        $("cover").value = `https://coverartarchive.org/release-group/${g.id}/front-250`;
        $("results").innerHTML = ""; say("Filled in. Add your rating and review.");
        $("ratingNum").focus();
      };
      $("results").appendChild(b);
    });
  }catch(e){ $("results").innerHTML = '<p class="hint">Lookup failed. Fill in the details by hand.</p>'; }
};
$("lookupQ").addEventListener("keydown", e => { if(e.key==="Enter"){ e.preventDefault(); $("lookupBtn").click(); } });
</script>
</body>
</html>
